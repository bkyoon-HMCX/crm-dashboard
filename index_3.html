/* ------------------------------------------------------------------ */
/* CSV parsing                                                          */
/* ------------------------------------------------------------------ */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function num(s) {
  if (s === undefined || s === null) return null;
  s = String(s).replace(/[",%\s]/g, "");
  if (s === "" || s === "-") return null;
  const n = parseFloat(s);
  return Number.isNaN(n) ? null : n;
}

function buildDataFromRows(rows) {
  if (!rows || rows.length < 4) throw new Error("시트 데이터가 비어 있습니다.");

  // A month-summary block is 3 rows (this-year / last-year / YoY%) whose
  // date/label column (index 1) is blank. Daily rows, by contrast, always
  // carry a date label there (e.g. "8월 1일 (토)") — that's the reliable
  // signal for where the monthly section ends and the daily section begins.
  const isBlankLabel = (r) => !r[1] || r[1].trim() === "";
  let monthCount = 0;
  while (true) {
    const rCur = rows[1 + 3 * monthCount], rPrev = rows[2 + 3 * monthCount], rYoy = rows[3 + 3 * monthCount];
    if (!rCur || !isBlankLabel(rCur) || num(rCur[COLS.uv]) === null) break;
    if (!rPrev || !isBlankLabel(rPrev)) break;
    if (!rYoy || !isBlankLabel(rYoy)) break;
    monthCount++;
    if (monthCount > 24) break;
  }
  if (monthCount === 0) throw new Error("월별 요약 행을 찾지 못했습니다.");

  const months = Array.from({ length: monthCount }, (_, i) => `${i + 1}월`);
  const monthly = { cur: {}, prev: {}, yoy: {} };
  for (const key of Object.keys(COLS)) {
    monthly.cur[key] = []; monthly.prev[key] = []; monthly.yoy[key] = [];
    for (let k = 0; k < monthCount; k++) {
      const rCur = rows[1 + 3 * k], rPrev = rows[2 + 3 * k], rYoy = rows[3 + 3 * k];
      monthly.cur[key].push(num(rCur ? rCur[COLS[key]] : null));
      monthly.prev[key].push(num(rPrev ? rPrev[COLS[key]] : null));
      monthly.yoy[key].push(num(rYoy ? rYoy[COLS[key]] : null));
    }
  }

  const dailyStart = 1 + 3 * monthCount;
  const dailyDates = [];
  const daily = {}; for (const k of DAILY_KEYS) daily[k] = [];
  for (let r = dailyStart; r < rows.length; r++) {
    const row = rows[r];
    if (!row || num(row[COLS.uv]) === null) break;
    dailyDates.push((row[1] || "").replace(/\s*\([^)]*\)/, ""));
    for (const key of DAILY_KEYS) daily[key].push(num(row[COLS[key]]));
  }

  return { months, monthly, dailyDates, daily };
}

const FONT_BODY = "'Pretendard', 'IBM Plex Sans KR', system-ui, sans-serif";

const fmt = (n, digits = 0) => {
  if (n === null || n === undefined || Number.isNaN(n)) return "–";
  return n.toLocaleString("ko-KR", { maximumFractionDigits: digits, minimumFractionDigits: digits });
};
const fmtCompact = (n) => {
  if (n === null || n === undefined) return "–";
  if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(1) + "억";
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + "만";
  return fmt(n);
};
const fmtWon = (n) => {
  if (n === null || n === undefined) return "–";
  if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(2) + "억원";
  if (Math.abs(n) >= 10000) return Math.round(n / 10000).toLocaleString("ko-KR") + "만원";
  return fmt(n) + "원";
};

const YoyTag = ({ v, invert = false }) => {
  if (v === null || v === undefined) return <span style={{ color: COLOR.textFaint }}>–</span>;
  const positive = invert ? v < 0 : v > 0;
  const color = v === 0 ? COLOR.textDim : positive ? COLOR.good : COLOR.bad;
  const arrow = v > 0 ? "▲" : v < 0 ? "▼" : "•";
  return (
    <span style={{ color, fontFamily: FONT_MONO, fontSize: 13, fontWeight: 600 }}>
      {arrow} {Math.abs(v).toFixed(1)}%
    </span>
  );
};

  const maxVal = cur[0] || 1;
  const prevMax = prev[0] || 1;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {FUNNEL_STAGES.map((s, i) => {
        const curVal = cur[i], prevVal = prev[i];
        const curPct = ((curVal || 0) / maxVal) * 100;
        const prevPct = ((prevVal || 0) / prevMax) * 100;
        const drop = i > 0 && cur[i - 1] ? ((curVal / cur[i - 1]) * 100).toFixed(0) : null;
        return (
          <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ width: 92, textAlign: "right", flexShrink: 0 }}>
              <div style={{ fontSize: 13, color: COLOR.text, fontFamily: FONT_BODY, fontWeight: 600 }}>{s.label}</div>
              <div style={{ fontSize: 10, color: COLOR.textFaint, fontFamily: FONT_MONO }}>{s.sub}</div>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ position: "relative", height: 26, background: COLOR.panelAlt, borderRadius: 4, overflow: "hidden" }}>
                <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${prevPct}%`, background: COLOR.slateDim, opacity: 0.55 }} />
                <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${curPct}%`, background: COLOR.amber, borderRadius: 4, transition: "width .3s" }} />
              </div>
            </div>
            <div style={{ width: 200, flexShrink: 0, display: "flex", alignItems: "baseline", gap: 8, fontFamily: FONT_MONO }}>
              <span style={{ color: COLOR.text, fontWeight: 700, fontSize: 14, minWidth: 72, textAlign: "right" }}>{fmtCompact(curVal)}</span>
              <span style={{ color: COLOR.textFaint, fontSize: 11 }}>vs {fmtCompact(prevVal)}</span>
              {drop && <span style={{ color: COLOR.textFaint, fontSize: 11, marginLeft: "auto" }}>{drop}%</span>}
            </div>
          </div>
        );
      })}
      <div style={{ display: "flex", gap: 16, marginTop: 4, fontSize: 11, color: COLOR.textDim, fontFamily: FONT_BODY }}>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 10, height: 10, background: COLOR.amber, borderRadius: 2, display: "inline-block" }} />금년
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 10, height: 10, background: COLOR.slateDim, borderRadius: 2, display: "inline-block", opacity: 0.8 }} />전년 동월
        </span>
        <span style={{ marginLeft: "auto", color: COLOR.textFaint }}>막대 오른쪽 %는 직전 단계 대비 전환율</span>
      </div>
    </div>
  );
}

function MonthlyTrend({ data, metricKey, valueFmt }) {
  const chartData = data.months.map((m, i) => ({ month: m, cur: data.monthly.cur[metricKey][i], prev: data.monthly.prev[metricKey][i] }));
  return (
    <ResponsiveContainer width="100%" height={260}>
      <LineChart data={chartData} margin={{ top: 8, right: 16, left: 4, bottom: 0 }}>
        <CartesianGrid stroke={COLOR.borderSoft} vertical={false} />
        <XAxis dataKey="month" stroke={COLOR.textFaint} tick={{ fontFamily: FONT_MONO, fontSize: 11, fill: COLOR.textDim }} axisLine={{ stroke: COLOR.border }} tickLine={false} />
        <YAxis stroke={COLOR.textFaint} tick={{ fontFamily: FONT_MONO, fontSize: 11, fill: COLOR.textDim }} axisLine={false} tickLine={false} tickFormatter={(v) => fmtCompact(v)} width={54} />
        <Tooltip contentStyle={{ background: COLOR.panelAlt, border: `1px solid ${COLOR.border}`, borderRadius: 8, fontFamily: FONT_MONO, fontSize: 12 }} labelStyle={{ color: COLOR.text }} formatter={(v, name) => [valueFmt(v), name === "cur" ? "금년" : "전년"]} />
        <Line type="monotone" dataKey="prev" stroke={COLOR.slate} strokeWidth={2} strokeDasharray="4 3" dot={{ r: 3, fill: COLOR.slate }} name="prev" />
        <Line type="monotone" dataKey="cur" stroke={COLOR.amber} strokeWidth={2.5} dot={{ r: 3.5, fill: COLOR.amber }} name="cur" />
      </LineChart>
    </ResponsiveContainer>
  );
}

function DailyChart({ data, metricKey, valueFmt }) {
  const chartData = data.dailyDates.map((d, i) => ({ date: d, value: data.daily[metricKey][i] }));
  return (
    <ResponsiveContainer width="100%" height={220}>
      <BarChart data={chartData} margin={{ top: 8, right: 8, left: 4, bottom: 0 }}>
        <CartesianGrid stroke={COLOR.borderSoft} vertical={false} />
        <XAxis dataKey="date" stroke={COLOR.textFaint} tick={{ fontFamily: FONT_MONO, fontSize: 10, fill: COLOR.textDim }} axisLine={{ stroke: COLOR.border }} tickLine={false} interval={Math.max(0, Math.floor(chartData.length / 15))} />
        <YAxis stroke={COLOR.textFaint} tick={{ fontFamily: FONT_MONO, fontSize: 11, fill: COLOR.textDim }} axisLine={false} tickLine={false} tickFormatter={(v) => fmtCompact(v)} width={54} />
        <Tooltip contentStyle={{ background: COLOR.panelAlt, border: `1px solid ${COLOR.border}`, borderRadius: 8, fontFamily: FONT_MONO, fontSize: 12 }} labelStyle={{ color: COLOR.text }} formatter={(v) => [valueFmt(v), "값"]} />
        <Bar dataKey="value" fill={COLOR.amber} radius={[3, 3, 0, 0]} />
      </BarChart>
    </ResponsiveContainer>
  );
}

function Pill({ active, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      fontFamily: FONT_BODY, fontSize: 12.5, fontWeight: 600, padding: "6px 13px", borderRadius: 999,
      border: `1px solid ${active ? COLOR.amber : COLOR.border}`,
      background: active ? "rgba(232,163,61,0.12)" : "transparent",
      color: active ? COLOR.amber : COLOR.textDim, cursor: "pointer", whiteSpace: "nowrap", transition: "all .15s",
    }}>
      {children}
    </button>
  );
}

function CrmDashboardLive() {
  const [data, setData] = useState(null);
  const [status, setStatus] = useState("loading");
  const [lastFetched, setLastFetched] = useState(null);

  const load = useCallback(async () => {
    setStatus("loading");
    try {
      const res = await fetch(CSV_URL(Date.now()));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      const parsed = buildDataFromRows(rows);
      setData(parsed);
      setStatus("live");
      setLastFetched(new Date());
    } catch (e) {
      setData(FALLBACK);
      setStatus("fallback");
      setLastFetched(null);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  const monthCount = data ? data.months.length : 0;
  const lastDayCount = data ? data.dailyDates.length : 0;
  const latestIsMtd = lastDayCount > 0 && lastDayCount < 28;
  const lastCompleteIdx = data ? Math.max(0, monthCount - (latestIsMtd ? 2 : 1)) : 0;

  const [funnelMonthIdx, setFunnelMonthIdx] = useState(null);
  const [groupId, setGroupId] = useState("funnel");
  const [metricKey, setMetricKey] = useState("mau");
  const [dailyMetricKey, setDailyMetricKey] = useState("uv");

  useEffect(() => {
    if (data && funnelMonthIdx === null) setFunnelMonthIdx(lastCompleteIdx);
  }, [data, lastCompleteIdx, funnelMonthIdx]);

  const group = METRIC_GROUPS.find((g) => g.id === groupId);
  const activeMetric = group.metrics.find((m) => m.key === metricKey) || group.metrics[0];
  const dailyMetric = DAILY_METRICS.find((m) => m.key === dailyMetricKey);

  const kpi = useMemo(() => {
    if (!data) return null;
    const i = lastCompleteIdx;
    const get = (k) => ({ v: data.monthly.cur[k][i], y: data.monthly.yoy[k][i] });
    return { uv: get("uv"), mau: get("mau"), orders: get("orders"), revenue: get("revenue"), arpu: get("arpu"), utilization: get("utilization_rate") };
  }, [data, lastCompleteIdx]);

  if (!data) {
    return (
      <div style={{ minHeight: "100vh", background: COLOR.bg, color: COLOR.textDim, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT_BODY }}>
        시트에서 데이터를 불러오는 중...
      </div>
    );
  }

  const latestMonthLabel = data.months[monthCount - 1];

  return (
    <div style={{ minHeight: "100vh", background: COLOR.bg, color: COLOR.text, fontFamily: FONT_BODY, padding: "28px 20px 60px" }}>
      <div style={{ maxWidth: 1180, margin: "0 auto" }}>
        <div style={{ marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 12 }}>
          <div>
            <div style={{ fontSize: 11, color: COLOR.amber, letterSpacing: 2, fontFamily: FONT_MONO, marginBottom: 6 }}>2026_CRM · MONTHLY FUNNEL</div>
            <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 30, fontWeight: 700, margin: 0, letterSpacing: -0.3 }}>CRM 퍼널 대시보드</h1>
            <div style={{ color: COLOR.textDim, fontSize: 13, marginTop: 6 }}>방문 → 설치 → 가입 → 탐색 → 예약 → 이용까지의 전환 흐름을 전년과 비교합니다.</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
            <button onClick={load} style={{
              fontFamily: FONT_BODY, fontSize: 12.5, fontWeight: 600, padding: "8px 14px", borderRadius: 8,
              border: `1px solid ${COLOR.border}`, background: COLOR.panel, color: COLOR.text, cursor: "pointer",
            }}>
              {status === "loading" ? "새로고침 중…" : "↻ 지금 새로고침"}
            </button>
            <div style={{ fontSize: 11, color: COLOR.textFaint, fontFamily: FONT_MONO }}>
              {status === "live" && lastFetched && `실시간 · ${lastFetched.toLocaleString("ko-KR")} 조회`}
              {status === "fallback" && "시트 연결 실패 · 저장된 스냅샷 표시 중"}
              {status === "loading" && "불러오는 중…"}
            </div>
          </div>
        </div>

        {status === "fallback" && (
          <div style={{ background: "rgba(226,102,79,0.1)", border: `1px solid ${COLOR.bad}`, color: COLOR.bad, borderRadius: 8, padding: "10px 14px", fontSize: 12.5, marginBottom: 20 }}>
            구글 시트에서 실시간 데이터를 불러오지 못해 마지막으로 저장된 스냅샷을 표시하고 있습니다. 시트 공유 설정이 "링크가 있는 모든 사용자"인지 확인해 주세요.
          </div>
        )}

        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
          <KpiCard label="방문자수 (UV)" value={fmtCompact(kpi.uv.v)} sub={`${data.months[lastCompleteIdx]} · YoY`} yoy={kpi.uv.y} />
          <KpiCard label="이용자수 (MAU)" value={fmtCompact(kpi.mau.v)} sub={`${data.months[lastCompleteIdx]} · YoY`} yoy={kpi.mau.y} />
          <KpiCard label="이용건수" value={fmtCompact(kpi.orders.v)} sub={`${data.months[lastCompleteIdx]} · YoY`} yoy={kpi.orders.y} />
          <KpiCard label="매출" value={fmtWon(kpi.revenue.v)} sub={`${data.months[lastCompleteIdx]} · YoY`} yoy={kpi.revenue.y} />
          <KpiCard label="인당매출 (ARPU)" value={fmtWon(kpi.arpu.v)} sub={`${data.months[lastCompleteIdx]} · YoY`} yoy={kpi.arpu.y} />
          <KpiCard label="가동율" value={(kpi.utilization.v ?? 0).toFixed(1) + "%"} sub={`${data.months[lastCompleteIdx]} · YoY(p)`} yoy={kpi.utilization.y} />
        </div>

        <div style={{ background: COLOR.panel, border: `1px solid ${COLOR.border}`, borderRadius: 14, padding: "22px 24px", marginBottom: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
            <h2 style={{ fontFamily: FONT_DISPLAY, fontSize: 17, fontWeight: 600, margin: 0 }}>월별 전환 퍼널</h2>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {data.months.map((m, i) => (
                <Pill key={m} active={i === funnelMonthIdx} onClick={() => setFunnelMonthIdx(i)}>
                  {m}{i === monthCount - 1 && latestIsMtd ? " (MTD)" : ""}
                </Pill>
              ))}
            </div>
          </div>
          <FunnelView data={data} monthIdx={funnelMonthIdx ?? lastCompleteIdx} />
        </div>

        <div style={{ background: COLOR.panel, border: `1px solid ${COLOR.border}`, borderRadius: 14, padding: "22px 24px", marginBottom: 24 }}>
          <h2 style={{ fontFamily: FONT_DISPLAY, fontSize: 17, fontWeight: 600, margin: 0 }}>월별 추이 (금년 vs 전년)</h2>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 6, marginTop: 14 }}>
            {METRIC_GROUPS.map((g) => (
              <Pill key={g.id} active={g.id === groupId} onClick={() => { setGroupId(g.id); setMetricKey(g.metrics[0].key); }}>{g.label}</Pill>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
            {group.metrics.map((m) => (
              <Pill key={m.key} active={m.key === metricKey} onClick={() => setMetricKey(m.key)}>{m.label}</Pill>
            ))}
          </div>
          <MonthlyTrend data={data} metricKey={activeMetric.key} valueFmt={activeMetric.fmt} />
        </div>

        <div style={{ background: COLOR.panel, border: `1px solid ${COLOR.border}`, borderRadius: 14, padding: "22px 24px", marginBottom: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
            <div>
              <h2 style={{ fontFamily: FONT_DISPLAY, fontSize: 17, fontWeight: 600, margin: 0 }}>{latestMonthLabel} 일별 추이</h2>
              <div style={{ fontSize: 12, color: COLOR.textFaint, marginTop: 4 }}>
                {latestIsMtd ? `진행 중인 달 (최근 업데이트분까지 ${lastDayCount}일)` : "완결된 달"}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {DAILY_METRICS.map((m) => (
                <Pill key={m.key} active={m.key === dailyMetricKey} onClick={() => setDailyMetricKey(m.key)}>{m.label}</Pill>
              ))}
            </div>
          </div>
          <DailyChart data={data} metricKey={dailyMetric.key} valueFmt={dailyMetric.fmt} />
        </div>

        <div style={{ fontSize: 11.5, color: COLOR.textFaint, lineHeight: 1.7, borderTop: `1px solid ${COLOR.borderSoft}`, paddingTop: 14 }}>
          · 이 대시보드는 열릴 때마다 구글 시트(2026_CRM 탭)에서 최신 값을 자동으로 다시 불러옵니다. 우측 상단의 "지금 새로고침"으로 즉시 갱신할 수도 있습니다.<br />
          · 진행 중인 달은 월중 데이터(MTD)이므로, 전년 동월(완결된 한 달) 수치와 단순 비교 시 YoY(%)가 실제 추세보다 크게 벌어져 보일 수 있습니다.<br />
          · 출처: CMS-퍼포먼스 데이터 스프레드시트, 2026_CRM 시트.
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CrmDashboardLive />);
</script>
</body>
</html>
