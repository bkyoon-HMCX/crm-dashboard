function parseCSV(t) {
  const rows = [];
  let row = [],
    field = "",
    inQ = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inQ) {
      if (c === '"') {
        if (t[i + 1] === '"') {
          field += '"';
          i++;
        } else inQ = false;
      } else field += c;
    } else {
      if (c === '"') inQ = true;else if (c === ",") {
        row.push(field);

      } else if (c === "\r") {/* skip */} else field += c;
    }

  if (field.length || row.length) {

    rows.push(row);
  }

}
function num(s) {

  s = String(s).replace(/[",%\s]/g, "");

  const v = parseFloat(s);

}
function parseSheetToData(csvText) {
  const rows = parseCSV(csvText);
  const isBlankLabel = r => !r[1] || r[1].trim() === "";

  // A month-summary block is 3 rows (this-year / last-year / YoY%) whose
  // date/label column (index 1) is blank. Daily rows always carry a date
  // label there — that's the reliable signal for the section boundary.
  let monthCount = 0;
  while (true) {
    const rCur = rows[1 + 3 * monthCount],
      rPrev = rows[2 + 3 * monthCount],
      rYoy = rows[3 + 3 * monthCount];
    if (!rCur || !isBlankLabel(rCur) || num(rCur[COLS.uv]) === null) break;
    if (!rPrev || !isBlankLabel(rPrev)) break;
    if (!rYoy || !isBlankLabel(rYoy)) break;
    monthCount++;
    if (monthCount > 24) break;
  }
  if (monthCount === 0) throw new Error("월별 요약 행을 찾지 못했습니다.");
  const months = Array.from({
    length: monthCount
  }, (_, i) => `${i + 1}월`);
  const monthly = {
    cur: {},
    prev: {},
    yoy: {}
  };
  for (const key of Object.keys(COLS)) {
    monthly.cur[key] = [];
    monthly.prev[key] = [];
    monthly.yoy[key] = [];
    for (let k = 0; k < monthCount; k++) {
      const rCur = rows[1 + 3 * k],
        rPrev = rows[2 + 3 * k],
        rYoy = rows[3 + 3 * k];
      monthly.cur[key].push(num(rCur ? rCur[COLS[key]] : null));
      monthly.prev[key].push(num(rPrev ? rPrev[COLS[key]] : null));
      monthly.yoy[key].push(num(rYoy ? rYoy[COLS[key]] : null));
    }
  }
  const dailyStart = 1 + 3 * monthCount;
  const dailyDates = [];
  const daily = {};
  for (const k of DAILY_KEYS) daily[k] = [];
  for (let r = dailyStart; r < rows.length; r++) {
    const row = rows[r];
    if (!row || num(row[COLS.uv]) === null) break;
    dailyDates.push((row[1] || "").replace(/\s*\([^)]*\)/, ""));
    for (const key of DAILY_KEYS) daily[key].push(num(row[COLS[key]]));
  }
  if (dailyDates.length === 0) throw new Error("일별 데이터를 찾지 못했습니다.");
  return {
    months,
    monthly,
    dailyDates,
    daily
  };
}
async function fetchLiveData() {

  return parseSheetToData(text);
}
